[package]
name = "null_adblock"
version = "1.0.0"
edition = "2024"
description = "Python bindings for Brave's adblock-rust, used by Null Browser."
license = "MPL-2.0"

[lib]
name = "null_adblock"
crate-type = ["cdylib"]

[dependencies]
adblock = { path = "../adblock-rust", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module", "generate-import-lib"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
